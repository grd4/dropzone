        let spreadsheetData = [];
        let currentAppData = {};
        let formData = {};

        // File upload handling
        const uploadBox = document.getElementById('uploadBox');
        const fileInput = document.getElementById('fileInput');

        uploadBox.addEventListener('click', () => fileInput.click());

        uploadBox.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadBox.classList.add('dragging');
        });

        uploadBox.addEventListener('dragleave', () => {
            uploadBox.classList.remove('dragging');
        });

        uploadBox.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadBox.classList.remove('dragging');
            const file = e.dataTransfer.files[0];
            if (file) handleFile(file);
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) handleFile(file);
        });

        function handleFile(file) {
            const reader = new FileReader();

            reader.onload = (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const jsonData = XLSX.utils.sheet_to_json(firstSheet);

                    if (jsonData.length === 0) {
                        alert('No data found in spreadsheet');
                        return;
                    }

                    spreadsheetData = jsonData;
                    populateAppPicker();
                } catch (error) {
                    alert('Error reading file: ' + error.message);
                }
            };

            reader.readAsArrayBuffer(file);
        }

        function populateAppPicker() {
            const appSelect = document.getElementById('appSelect');
            appSelect.innerHTML = '<option value="">-- Choose an application --</option>';

            spreadsheetData.forEach((row, index) => {
                const appName = row.ApplicationName || row['Application Name'] || row.Application || `Row ${index + 1}`;
                const option = document.createElement('option');
                option.value = index;
                option.textContent = appName;
                appSelect.appendChild(option);
            });

            document.getElementById('uploadSection').style.display = 'none';
            document.getElementById('appPicker').classList.add('active');
        }

        function loadApplication() {
            const appSelect = document.getElementById('appSelect');
            const selectedIndex = appSelect.value;

            if (selectedIndex === '') {
                alert('Please select an application');
                return;
            }

            currentAppData = spreadsheetData[selectedIndex];
            formData = {};

            // Set today's date
            formData.InterviewDate = new Date().toISOString().split('T')[0];

            renderForm();

            document.getElementById('appPicker').classList.remove('active');
            document.getElementById('formSection').classList.add('active');
            document.getElementById('navigation').style.display = 'flex';
        }

        function renderForm() {
            const formContent = document.getElementById('formContent');
            formContent.innerHTML = '';

            formDefinition.sections.forEach(section => {
                const sectionDiv = document.createElement('div');
                sectionDiv.className = 'section';
                sectionDiv.innerHTML = `<h2 class="section-title">${section.title}</h2>`;

                section.questions.forEach(question => {
                    const questionDiv = createQuestionElement(question);
                    sectionDiv.appendChild(questionDiv);
                });

                formContent.appendChild(sectionDiv);
            });

            applyBranchingLogic();
            updateProgress();
        }

        function createQuestionElement(question) {
            const questionDiv = document.createElement('div');
            questionDiv.className = 'question';
            questionDiv.id = `q_${question.id}`;

            const isPrefilled = question.prefill_param && currentAppData[question.prefill_param];
            const prefillValue = isPrefilled ? currentAppData[question.prefill_param] : '';

            let labelHTML = `<label class="question-label">${question.title}`;
            if (question.required) labelHTML += ' <span class="required">*</span>';
            if (isPrefilled) labelHTML += ' <span class="prefill-badge">PREFILLED</span>';
            labelHTML += '</label>';

            questionDiv.innerHTML = labelHTML;

            let inputHTML = '';

            switch (question.type) {
                case 'text':
                    inputHTML = `<input type="text" id="${question.id}" name="${question.id}"
                        value="${prefillValue}" ${isPrefilled ? 'class="prefilled"' : ''}
                        ${question.required ? 'required' : ''}>`;
                    break;

                case 'number':
                    inputHTML = `<input type="number" id="${question.id}" name="${question.id}"
                        value="${prefillValue}" ${isPrefilled ? 'class="prefilled"' : ''}
                        ${question.required ? 'required' : ''}>`;
                    break;

                case 'date':
                    const dateValue = prefillValue || formData.InterviewDate || '';
                    inputHTML = `<input type="date" id="${question.id}" name="${question.id}"
                        value="${dateValue}" ${isPrefilled ? 'class="prefilled"' : ''}
                        ${question.required ? 'required' : ''}>`;
                    break;

                case 'long_text':
                    inputHTML = `<textarea id="${question.id}" name="${question.id}"
                        ${isPrefilled ? 'class="prefilled"' : ''}
                        ${question.required ? 'required' : ''}>${prefillValue}</textarea>`;
                    break;

                case 'choice_single':
                    inputHTML = '<div class="radio-group">';
                    question.choices.forEach(choice => {
                        const checked = prefillValue === choice ? 'checked' : '';
                        const radioClass = prefillValue === choice ? 'prefilled' : '';
                        inputHTML += `
                            <div class="radio-item ${radioClass}">
                                <input type="radio" id="${question.id}_${choice}"
                                    name="${question.id}" value="${choice}" ${checked}
                                    ${question.required ? 'required' : ''}>
                                <label for="${question.id}_${choice}">${choice}</label>
                            </div>`;
                    });
                    inputHTML += '</div>';
                    break;

                case 'choice_multi':
                    inputHTML = '<div class="checkbox-group">';
                    question.choices.forEach(choice => {
                        inputHTML += `
                            <div class="checkbox-item">
                                <input type="checkbox" id="${question.id}_${choice}"
                                    name="${question.id}" value="${choice}">
                                <label for="${question.id}_${choice}">${choice}</label>
                            </div>`;
                    });
                    inputHTML += '</div>';
                    break;
            }

            questionDiv.innerHTML += inputHTML;

            if (question.help_text) {
                questionDiv.innerHTML += `<div class="help-text">${question.help_text}</div>`;
            }

            // Add event listeners
            const inputs = questionDiv.querySelectorAll('input, textarea, select');
            inputs.forEach(input => {
                input.addEventListener('change', () => {
                    collectFormData();
                    applyBranchingLogic();
                    updateProgress();
                });
            });

            return questionDiv;
        }

        function collectFormData() {
            formData = {};

            formDefinition.sections.forEach(section => {
                section.questions.forEach(question => {
                    if (question.type === 'choice_multi') {
                        const checkboxes = document.querySelectorAll(`input[name="${question.id}"]:checked`);
                        formData[question.id] = Array.from(checkboxes).map(cb => cb.value);
                    } else if (question.type === 'choice_single') {
                        const radio = document.querySelector(`input[name="${question.id}"]:checked`);
                        formData[question.id] = radio ? radio.value : '';
                    } else {
                        const input = document.getElementById(question.id);
                        formData[question.id] = input ? input.value : '';
                    }
                });
            });
        }

        function applyBranchingLogic() {
            // First hide all conditional questions
            const conditionalQuestions = new Set();
            formDefinition.branching_rules.forEach(rule => {
                rule.then_show.forEach(qid => conditionalQuestions.add(qid));
            });

            conditionalQuestions.forEach(qid => {
                const questionEl = document.getElementById(`q_${qid}`);
                if (questionEl) questionEl.classList.add('hidden');
            });

            // Apply rules
            formDefinition.branching_rules.forEach(rule => {
                if (evaluateCondition(rule.if)) {
                    rule.then_show.forEach(qid => {
                        const questionEl = document.getElementById(`q_${qid}`);
                        if (questionEl) questionEl.classList.remove('hidden');
                    });
                }
            });
        }

        function evaluateCondition(condition) {
            // Parse condition like "AccessMethod contains 'Web browser'"
            const containsMatch = condition.match(/(\w+) contains '([^']+)'/);
            if (containsMatch) {
                const [, fieldId, value] = containsMatch;
                const fieldValue = formData[fieldId];
                if (Array.isArray(fieldValue)) {
                    return fieldValue.includes(value);
                }
                return fieldValue && fieldValue.includes(value);
            }

            // Parse condition like "KerberosSPN == 'Yes'"
            const equalsMatch = condition.match(/(\w+) == '([^']+)'/);
            if (equalsMatch) {
                const [, fieldId, value] = equalsMatch;
                return formData[fieldId] === value;
            }

            // Parse condition like "UsesRhapsody startswith 'Yes'"
            const startsWithMatch = condition.match(/(\w+) startswith '([^']+)'/);
            if (startsWithMatch) {
                const [, fieldId, value] = startsWithMatch;
                return formData[fieldId] && formData[fieldId].startsWith(value);
            }

            // Parse "contains any of" condition
            const containsAnyMatch = condition.match(/(\w+) contains any of \[([^\]]+)\]/);
            if (containsAnyMatch) {
                const [, fieldId, valuesStr] = containsAnyMatch;
                const values = valuesStr.split(',').map(v => v.trim().replace(/'/g, ''));
                const fieldValue = formData[fieldId];
                if (Array.isArray(fieldValue)) {
                    return values.some(v => fieldValue.includes(v));
                }
                return false;
            }

            return false;
        }

        function updateProgress() {
            let totalRequired = 0;
            let completedRequired = 0;

            formDefinition.sections.forEach(section => {
                section.questions.forEach(question => {
                    const questionEl = document.getElementById(`q_${question.id}`);
                    if (question.required && questionEl && !questionEl.classList.contains('hidden')) {
                        totalRequired++;
                        const value = formData[question.id];
                        if (value && (Array.isArray(value) ? value.length > 0 : value.trim() !== '')) {
                            completedRequired++;
                        }
                    }
                });
            });

            const progress = totalRequired > 0 ? (completedRequired / totalRequired) * 100 : 0;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        function validateAndExport() {
            collectFormData();

            let missingFields = [];

            formDefinition.sections.forEach(section => {
                section.questions.forEach(question => {
                    const questionEl = document.getElementById(`q_${question.id}`);
                    if (question.required && questionEl && !questionEl.classList.contains('hidden')) {
                        const value = formData[question.id];
                        if (!value || (Array.isArray(value) ? value.length === 0 : value.trim() === '')) {
                            missingFields.push(question.title);
                        }
                    }
                });
            });

            if (missingFields.length > 0) {
                alert('Please complete the following required fields:\n\n' + missingFields.join('\n'));
                return;
            }

            exportResults();
        }

        function exportResults() {
            const results = {
                form: formDefinition.form.name,
                version: formDefinition.form.version,
                completedDate: new Date().toISOString(),
                prefillSource: currentAppData,
                responses: formData
            };

            // Export as JSON
            const jsonStr = JSON.stringify(results, null, 2);
            const blob = new Blob([jsonStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `interview_${formData.ApplicationName || 'unknown'}_${new Date().toISOString().split('T')[0]}.json`;
            a.click();

            // Show summary
            showSummary();
        }

        function showSummary() {
            const summaryContent = document.getElementById('summaryContent');
            summaryContent.innerHTML = '<div class="alert alert-success">✓ Interview completed successfully! Results have been downloaded.</div>';

            formDefinition.analytics_contract.key_fields.forEach(fieldId => {
                const value = formData[fieldId];
                if (value) {
                    const question = findQuestionById(fieldId);
                    if (question) {
                        const summaryItem = document.createElement('div');
                        summaryItem.className = 'summary-item';
                        summaryItem.innerHTML = `
                            <div class="summary-label">${question.title}</div>
                            <div class="summary-value">${Array.isArray(value) ? value.join(', ') : value}</div>
                        `;
                        summaryContent.appendChild(summaryItem);
                    }
                }
            });

            document.getElementById('formSection').classList.remove('active');
            document.getElementById('summarySection').classList.add('active');
        }

        function findQuestionById(id) {
            for (const section of formDefinition.sections) {
                const question = section.questions.find(q => q.id === id);
                if (question) return question;
            }
            return null;
        }

        function resetUpload() {
            spreadsheetData = [];
            currentAppData = {};
            formData = {};
            document.getElementById('uploadSection').style.display = 'block';
            document.getElementById('appPicker').classList.remove('active');
            document.getElementById('formSection').classList.remove('active');
            document.getElementById('summarySection').classList.remove('active');
            document.getElementById('navigation').style.display = 'none';
            document.getElementById('fileInput').value = '';
        }

        function startNewInterview() {
            formData = {};
            document.getElementById('summarySection').classList.remove('active');
            document.getElementById('appPicker').classList.add('active');
        }
    </script>
</body>
